      // 1. Role & Access Key Initialization
      (function initZedRoles() {
        const isAdmin = localStorage.getItem('openwa_admin_authenticated') === 'true';

        if (isAdmin) {
          localStorage.setItem('openwa_user_role', 'admin');
          sessionStorage.setItem('openwa_api_key', 'openwa-meta-key-2026');
        } else {
          // Default: Observer view for all visitors without any admin session
          localStorage.setItem('openwa_user_role', 'viewer');
          sessionStorage.setItem('openwa_api_key', 'zed-client-view-key');
        }
      })();

      // 2. Metrics generator (AI ~ 1000, Server ~ 2500, Total ~ 3500, e.g. 3492.45rs or 3521.32)
      function getZedSystemMetrics() {
        let cached = sessionStorage.getItem('zed_sys_metrics');
        if (cached) {
          try { return JSON.parse(cached); } catch(e) {}
        }
        // Candidates with exact cents matching user prompt examples:
        const candidates = [
          { ai: 994.25, server: 2498.20, total: 3492.45, ram: 418.6, cpu: 12.4, tokens: '42,850' },
          { ai: 1016.12, server: 2505.20, total: 3521.32, ram: 432.1, cpu: 14.8, tokens: '46,120' },
          { ai: 1004.85, server: 2496.60, total: 3501.45, ram: 424.5, cpu: 11.9, tokens: '44,300' },
          { ai: 988.70, server: 2508.45, total: 3497.15, ram: 415.8, cpu: 13.2, tokens: '41,920' },
          { ai: 1012.30, server: 2499.50, total: 3511.80, ram: 429.3, cpu: 12.8, tokens: '45,600' }
        ];
        const idx = Math.floor((Date.now() / 300000) % candidates.length);
        const selected = candidates[idx];
        sessionStorage.setItem('zed_sys_metrics', JSON.stringify(selected));
        return selected;
      }

      // 3. Continuous brand and UI enforcer
      function enforceZedBranding() {
        const isAdmin = localStorage.getItem('openwa_admin_authenticated') === 'true';

        // Clean document title - NO "client" words
        if (document.title.includes('OpenWA') || document.title.includes('Client')) {
          document.title = 'zed';
        }

        // Brand name elements
        document.querySelectorAll('.brand-name').forEach(el => {
          if (el.textContent.trim() === 'OpenWA') el.textContent = 'zed';
        });

        // Logo images
        document.querySelectorAll('.sidebar-logo, .logo-icon').forEach(img => {
          if (!img.src.includes('z-logo.png')) {
            img.src = '/z-logo.png';
            img.alt = 'zed';
          }
        });

        // Clean sidebar brand: NO word "client" anywhere!
        document.querySelectorAll('.sidebar-brand').forEach(brandEl => {
          let badge = brandEl.querySelector('.zed-role-badge');
          if (isAdmin) {
            if (!badge) {
              badge = document.createElement('span');
              badge.className = 'zed-role-badge zed-badge-admin';
              brandEl.appendChild(badge);
            }
            badge.innerHTML = '👑 Administrator';
          } else {
            if (badge) badge.remove();
          }
        });

        // Remove mobile role badge & role switch buttons
        document.querySelectorAll('.zed-role-badge-mob, .zed-role-switch-btn').forEach(el => el.remove());

        // Intercept Logout click to reset admin state
        document.querySelectorAll('.sidebar-footer button, .sidebar-footer a').forEach(btn => {
          if (btn.textContent.includes('Logout') || btn.getAttribute('aria-label') === 'Logout') {
            if (!btn.dataset.zedLogoutBound) {
              btn.dataset.zedLogoutBound = 'true';
              btn.addEventListener('click', () => {
                localStorage.removeItem('openwa_admin_authenticated');
                localStorage.removeItem('openwa_user_role');
                sessionStorage.removeItem('openwa_api_key');
              });
            }
          }
        });

        // Update Dashboard Cards & Resource Panel on Default View
        const dashboard = document.querySelector('.dashboard');
        if (dashboard && !isAdmin) {
          const m = getZedSystemMetrics();
          const ramPct = ((m.ram / 1024) * 100).toFixed(1);

          // Update the 4 top stat cards in .stats-grid
          const statCards = dashboard.querySelectorAll('.stats-grid .stat-card');
          if (statCards.length >= 4) {
            // Card 1: Messages
            const c1Label = statCards[0].querySelector('.stat-label');
            const c1Detail = statCards[0].querySelector('.stat-detail');
            if (c1Label && c1Label.textContent !== 'MESSAGES PROCESSED') {
              c1Label.textContent = 'MESSAGES PROCESSED';
              if (c1Detail) c1Detail.textContent = 'Active Inquiries & Consultations';
            }

            // Card 2: AI Cost (~1000)
            const c2Label = statCards[1].querySelector('.stat-label');
            const c2Val = statCards[1].querySelector('.stat-value');
            const c2Detail = statCards[1].querySelector('.stat-detail');
            if (c2Label) {
              c2Label.textContent = 'AI COMPUTATION COST';
              c2Val.textContent = '₹' + m.ai.toFixed(2);
              if (c2Detail) c2Detail.textContent = `Gemini 1.5 Flash • ${m.tokens} Tokens`;
            }

            // Card 3: Cloud Server Cost (~2500)
            const c3Label = statCards[2].querySelector('.stat-label');
            const c3Val = statCards[2].querySelector('.stat-value');
            const c3Detail = statCards[2].querySelector('.stat-detail');
            if (c3Label) {
              c3Label.textContent = 'CLOUD SERVER & INFRA';
              c3Val.textContent = '₹' + m.server.toFixed(2);
              if (c3Detail) c3Detail.textContent = `RAM: ${m.ram.toFixed(0)} MB • 24/7 Hosting`;
            }

            // Card 4: Total Operational Cost (~3500)
            const c4Label = statCards[3].querySelector('.stat-label');
            const c4Val = statCards[3].querySelector('.stat-value');
            const c4Detail = statCards[3].querySelector('.stat-detail');
            if (c4Label) {
              c4Label.textContent = 'TOTAL RESOURCE USAGE';
              c4Val.textContent = '₹' + m.total.toFixed(2);
              if (c4Detail) c4Detail.textContent = `${m.total.toFixed(2)} Rs (Monthly Minimum)`;
            }
          }

          // Inject or update Resource & Cloud Metrics Panel below stats-grid
          const statsGrid = dashboard.querySelector('.stats-grid');
          let panel = dashboard.querySelector('.zed-client-resources-panel');
          if (statsGrid && !panel) {
            panel = document.createElement('div');
            panel.className = 'zed-client-resources-panel';
            statsGrid.parentNode.insertBefore(panel, statsGrid.nextSibling);
          }
          if (panel) {
            panel.innerHTML = `
              <div class="zed-panel-header">
                <div class="zed-panel-title-box">
                  <h3 class="zed-panel-title">⚡ Cloud Infrastructure & Resource Consumption</h3>
                  <span class="zed-panel-subtitle">Real-time compute footprint, memory utilization & AI operational billing</span>
                </div>
                <div class="zed-panel-badges">
                  <span class="zed-live-pill"><span class="zed-pulse-dot"></span> Live Meter</span>
                </div>
              </div>

              <div class="zed-resources-grid">
                <!-- Meter 1: Dedicated Server RAM -->
                <div class="zed-res-card">
                  <div class="zed-res-header">
                    <span class="zed-res-icon">💾</span>
                    <div class="zed-res-meta">
                      <span class="zed-res-label">Server Memory (RAM)</span>
                      <span class="zed-res-val">${m.ram.toFixed(1)} MB <small>/ 1024 MB</small></span>
                    </div>
                    <span class="zed-res-tag optimal">${ramPct}% Optimal</span>
                  </div>
                  <div class="zed-progress-track">
                    <div class="zed-progress-fill ram-fill" style="width: ${ramPct}%;"></div>
                  </div>
                  <div class="zed-res-footer">
                    <span>Render Cloud Dedicated Process</span>
                    <span class="text-success">● 0 Memory Leaks</span>
                  </div>
                </div>

                <!-- Meter 2: Cloud Server & Cron Hosting -->
                <div class="zed-res-card">
                  <div class="zed-res-header">
                    <span class="zed-res-icon">☁️</span>
                    <div class="zed-res-meta">
                      <span class="zed-res-label">Cloud Server Infrastructure</span>
                      <span class="zed-res-val">₹${m.server.toFixed(2)}</span>
                    </div>
                    <span class="zed-res-tag active">99.98% Uptime</span>
                  </div>
                  <div class="zed-progress-track">
                    <div class="zed-progress-fill server-fill" style="width: 71%;"></div>
                  </div>
                  <div class="zed-res-footer">
                    <span>15-Min Inactivity Cron Guard</span>
                    <span class="text-success">● High-Speed Node</span>
                  </div>
                </div>

                <!-- Meter 3: AI Model & Intelligence -->
                <div class="zed-res-card">
                  <div class="zed-res-header">
                    <span class="zed-res-icon">🤖</span>
                    <div class="zed-res-meta">
                      <span class="zed-res-label">Gemini AI Intelligence</span>
                      <span class="zed-res-val">₹${m.ai.toFixed(2)}</span>
                    </div>
                    <span class="zed-res-tag ai">Active Bot</span>
                  </div>
                  <div class="zed-progress-track">
                    <div class="zed-progress-fill ai-fill" style="width: 29%;"></div>
                  </div>
                  <div class="zed-res-footer">
                    <span>Natural Pacing & Tone Guard</span>
                    <span class="text-success">● 1.1s Latency</span>
                  </div>
                </div>

                <!-- Meter 4: Total Cost Breakdown -->
                <div class="zed-res-card zed-total-card">
                  <div class="zed-res-header">
                    <span class="zed-res-icon">💳</span>
                    <div class="zed-res-meta">
                      <span class="zed-res-label">Total Operational Cost</span>
                      <span class="zed-res-val total-cost">₹${m.total.toFixed(2)}</span>
                    </div>
                    <span class="zed-res-tag billed">Active Billing</span>
                  </div>
                  <div class="zed-cost-formula">
                    <span>AI: ₹${m.ai.toFixed(2)}</span>
                    <span>+</span>
                    <span>Server: ₹${m.server.toFixed(2)}</span>
                  </div>
                  <div class="zed-res-footer">
                    <span>Calculated Monthly Usage</span>
                    <span class="text-primary font-mono">${m.total.toFixed(2)} Rs</span>
                  </div>
                </div>
              </div>
            `;
          }

          // In sessions table, hide Disconnect button for default observer
          dashboard.querySelectorAll('.sessions-table .actions .btn-sm.danger').forEach(btn => {
            btn.style.display = 'none';
          });
        } else if (dashboard && isAdmin) {
          // In Admin mode, remove resource panel
          const panel = dashboard.querySelector('.zed-client-resources-panel');
          if (panel) panel.remove();
          dashboard.querySelectorAll('.sessions-table .actions .btn-sm.danger').forEach(btn => {
            btn.style.display = '';
          });
        }
      }

      setInterval(enforceZedBranding, 300);
      window.addEventListener('DOMContentLoaded', enforceZedBranding);
    </script>
