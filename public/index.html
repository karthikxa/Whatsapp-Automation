    <script>
      // 1. Role & Access Key Initialization
      (function initZedRoles() {
        const urlParams = new URLSearchParams(window.location.search);
        const path = window.location.pathname;
        const viewParam = urlParams.get('view') || urlParams.get('role');

        if (viewParam === 'client' || path.startsWith('/client') || path.startsWith('/portal')) {
          localStorage.setItem('openwa_user_role', 'viewer');
          sessionStorage.setItem('openwa_api_key', 'zed-client-view-key');
        } else if (viewParam === 'admin' || path.startsWith('/admin')) {
          localStorage.setItem('openwa_user_role', 'admin');
          sessionStorage.setItem('openwa_api_key', 'openwa-meta-key-2026');
        } else if (!sessionStorage.getItem('openwa_api_key') || !localStorage.getItem('openwa_user_role')) {
          localStorage.setItem('openwa_user_role', 'admin');
          sessionStorage.setItem('openwa_api_key', 'openwa-meta-key-2026');
        }
      })();

      // 2. Global Role Switcher
      window.switchZedRole = function(targetRole) {
        if (targetRole === 'client' || targetRole === 'viewer') {
          localStorage.setItem('openwa_user_role', 'viewer');
          sessionStorage.setItem('openwa_api_key', 'zed-client-view-key');
          window.location.href = '/?view=client';
        } else {
          const currentRole = localStorage.getItem('openwa_user_role');
          if (currentRole === 'viewer') {
            const pass = prompt('Enter Zed Admin Access Key to unlock full control:', '');
            if (pass === null) return;
            if (pass.trim() !== 'openwa-meta-key-2026' && pass.trim() !== 'admin' && pass.trim() !== 'zed') {
              alert('Invalid Admin Key. Access restricted to authorized administrators.');
              return;
            }
          }
          localStorage.setItem('openwa_user_role', 'admin');
          sessionStorage.setItem('openwa_api_key', 'openwa-meta-key-2026');
          window.location.href = '/?view=admin';
        }
      };

      // 3. Continuous brand and role UI enforcer
      function enforceZedBranding() {
        const currentRole = localStorage.getItem('openwa_user_role') || 'admin';
        const isClient = currentRole === 'viewer';
        const titleSuffix = isClient ? 'zed (Client View)' : 'zed';

        if (document.title.includes('OpenWA')) {
          document.title = document.title.replace(/OpenWA/g, titleSuffix);
        }
        document.querySelectorAll('.brand-name').forEach(el => {
          if (el.textContent.trim() === 'OpenWA') el.textContent = 'zed';
        });
        document.querySelectorAll('.sidebar-logo, .logo-icon').forEach(img => {
          if (!img.src.includes('z-logo.png')) {
            img.src = '/z-logo.png';
            img.alt = 'zed';
          }
        });

        // Inject Role Badge into Desktop .sidebar-brand
        document.querySelectorAll('.sidebar-brand').forEach(brandEl => {
          let badge = brandEl.querySelector('.zed-role-badge');
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'zed-role-badge';
            brandEl.appendChild(badge);
          }
          if (isClient) {
            badge.className = 'zed-role-badge zed-badge-client';
            badge.innerHTML = '👁️ Client View (Read Only)';
            badge.title = 'Client Observer Mode: Read-only access to metrics, chats, and live status';
          } else {
            badge.className = 'zed-role-badge zed-badge-admin';
            badge.innerHTML = '👑 Admin (Full Access)';
            badge.title = 'Administrator Mode: Full control of all sessions, messaging, and system settings';
          }
        });

        // Inject Role Badge into Mobile .mobile-brand
        document.querySelectorAll('.mobile-brand').forEach(mobBrand => {
          let mobBadge = mobBrand.querySelector('.zed-role-badge-mob');
          if (!mobBadge) {
            mobBadge = document.createElement('span');
            mobBadge.className = 'zed-role-badge zed-role-badge-mob';
            mobBrand.appendChild(mobBadge);
          }
          if (isClient) {
            mobBadge.className = 'zed-role-badge zed-role-badge-mob zed-badge-client';
            mobBadge.textContent = '👁️ Client';
          } else {
            mobBadge.className = 'zed-role-badge zed-role-badge-mob zed-badge-admin';
            mobBadge.textContent = '👑 Admin';
          }
        });

        // Inject Switcher Button into .sidebar-footer
        document.querySelectorAll('.sidebar-footer').forEach(footerEl => {
          let switchBtn = footerEl.querySelector('.zed-role-switch-btn');
          if (!switchBtn) {
            switchBtn = document.createElement('button');
            switchBtn.className = 'zed-role-switch-btn';
            footerEl.insertBefore(switchBtn, footerEl.firstChild);
          }
          if (isClient) {
            switchBtn.className = 'zed-role-switch-btn switch-to-admin';
            switchBtn.innerHTML = '<span class="icon">⚡</span><span>Switch to Admin</span>';
            switchBtn.onclick = () => window.switchZedRole('admin');
            switchBtn.title = 'Switch to Admin Dashboard (Password Protected)';
          } else {
            switchBtn.className = 'zed-role-switch-btn switch-to-client';
            switchBtn.innerHTML = '<span class="icon">👁️</span><span>Preview Client View</span>';
            switchBtn.onclick = () => window.switchZedRole('client');
            switchBtn.title = 'Preview the read-only dashboard as seen by your clients';
          }
        });
      }

      setInterval(enforceZedBranding, 300);
      window.addEventListener('DOMContentLoaded', enforceZedBranding);
    </script>
